name: Forum daily check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"  # UTC 01:17 = Beijing 09:17

permissions:
  contents: read

concurrency:
  group: forum-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run check-in
        env:
          NODESEEK_COOKIE: ${{ secrets.NODESEEK_COOKIE }}
          NODELOC_COOKIE: ${{ secrets.NODELOC_COOKIE }}
          LINUXSB_COOKIE: ${{ secrets.LINUXSB_COOKIE }}
        run: python checkin.py
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 3
