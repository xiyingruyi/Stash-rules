name: Forum Check-in

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: forum-checkin
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run forum check-in
        working-directory: forum-checkin
        env:
          NODESEEK_COOKIES: ${{ secrets.NODESEEK_COOKIES }}
          NODELOC_COOKIES: ${{ secrets.NODELOC_COOKIES }}
          LINUX_SB_COOKIES: ${{ secrets.LINUX_SB_COOKIES }}
        run: python checkin.py

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-debug-screenshots
          path: "*-debug.png"
          if-no-files-found: ignore
          retention-days: 7
